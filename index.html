<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family money</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F0;--ink:#14162B;--muted:#63667A;--brand:#2D2A86;--brand2:#3D39A8;--line:rgba(20,22,43,.08);--pos:#0B7A53;--neg:#B42318}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#ECEBF7 0%,var(--bg) 340px);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:22px 18px 120px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:17px;font-weight:800;margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(20,22,43,.04),0 10px 24px -14px rgba(20,22,43,.18);padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(165deg,var(--brand2),#2A2678);color:#fff;border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 34px -16px rgba(42,38,120,.6)}
.muted{color:var(--muted);font-size:13px}
.num{font-weight:800;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.btn{display:block;width:100%;border:0;border-radius:18px;min-height:56px;font:700 16px 'Plus Jakarta Sans',sans-serif;color:#fff;background:linear-gradient(180deg,var(--brand2),#2A2678);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -3px 0 rgba(0,0,0,.22),0 10px 20px -8px rgba(42,38,120,.55);cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.6}
.btn2{border:1px solid var(--line);border-radius:14px;min-height:40px;padding:0 14px;font:700 13px 'Plus Jakarta Sans',sans-serif;color:var(--ink);background:#fff;cursor:pointer}
.chip{border-radius:999px;padding:0 14px;min-height:38px;font:600 13px 'Plus Jakarta Sans',sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
input,select{font:600 16px 'Plus Jakarta Sans',sans-serif;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;background:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:600;margin-top:14px}
.check input{width:20px;height:20px;padding:0}
nav{position:fixed;left:14px;right:14px;bottom:14px;max-width:452px;margin:0 auto;height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 10px;border-radius:26px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 30px -12px rgba(20,22,43,.3)}
nav button{border:0;background:transparent;height:56px;font:600 12px 'Plus Jakarta Sans',sans-serif;color:#62657A;border-radius:16px;cursor:pointer}
nav button[aria-current]{color:var(--brand);background:rgba(45,42,134,.09)}
nav .fab{width:56px;height:56px;border-radius:20px;color:#fff;font-size:28px;font-weight:600;background:linear-gradient(180deg,var(--brand2),#2A2678);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.25),0 10px 20px -6px rgba(42,38,120,.6)}
.msg{font-size:13px;color:var(--neg);min-height:18px;margin:10px 0 0}
.hidden{display:none!important}
</style>
</head>
<body>
<main>

<section id="setup" class="hidden">
  <h1>Set up</h1>
  <div class="card">
    <label for="s-me">Your name (used for your private file)</label>
    <input id="s-me" autocomplete="off" placeholder="ram">
    <label for="s-owner">GitHub username</label>
    <input id="s-owner" autocomplete="off" value="Ramvilla1997">
    <label for="s-repo">Private data repo name</label>
    <input id="s-repo" autocomplete="off" placeholder="family-money-data">
    <label for="s-token">Fine-grained token (Contents: read and write, this repo only)</label>
    <input id="s-token" type="password" autocomplete="off">
    <label for="s-budget">Monthly spending budget (CAD)</label>
    <input id="s-budget" inputmode="decimal" value="1850">
    <p class="msg" id="s-msg"></p>
    <button class="btn" id="s-save" style="margin-top:12px">Save and connect</button>
  </div>
</section>

<section id="home" class="hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div><div class="muted" id="today"></div><h1 style="margin:2px 0 0">Your money</h1></div>
    <button class="btn2" id="gear" aria-label="Settings">Settings</button>
  </div>
  <div class="hero">
    <div style="font-size:13px;opacity:.8">Left to spend this month</div>
    <div class="num" style="font-size:40px;line-height:1.1" id="left">—</div>
    <div style="font-size:13px;opacity:.8;margin-top:4px" id="left-sub"></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Today</h2><span class="muted num" id="today-total"></span></div>
    <div id="today-list"></div>
  </div>
  <div class="card">
    <h2>Home fund</h2>
    <div class="num" style="font-size:24px;margin-top:6px" id="fund-balance">—</div>
    <div id="fund-list" style="margin-top:8px"></div>
  </div>
</section>

<section id="activity" class="hidden">
  <h1>Activity</h1>
  <div class="card" id="activity-list"></div>
</section>

<section id="add" class="hidden">
  <h1>Add</h1>
  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="kinds">
      <button class="chip" data-kind="expense" aria-pressed="true">Expense</button>
      <button class="chip" data-kind="income" aria-pressed="false">Income</button>
      <button class="chip" data-kind="fund" aria-pressed="false">Home fund</button>
    </div>
    <label for="a-amt">Amount (CAD)</label>
    <input id="a-amt" inputmode="decimal" placeholder="0.00" autocomplete="off">
    <div id="cat-wrap">
      <label for="a-cat">Category</label>
      <select id="a-cat">
        <option>Food</option><option>Transport</option><option>Shopping</option>
        <option>Bills</option><option>Health</option><option>Other</option>
      </select>
      <label class="check"><input type="checkbox" id="a-fund"> Paid from home fund</label>
    </div>
    <label for="a-date">Date</label>
    <input id="a-date" type="date">
    <label for="a-note">Note (optional)</label>
    <input id="a-note" maxlength="80" autocomplete="off">
    <p class="msg" id="a-msg"></p>
    <button class="btn" id="a-save" style="margin-top:12px">Save</button>
  </div>
</section>

</main>

<nav id="tabs" class="hidden">
  <button data-go="home">Home</button>
  <button class="fab" data-go="add" aria-label="Add an entry">+</button>
  <button data-go="activity">Activity</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const KEY = 'fm-settings';
const cfg = () => JSON.parse(localStorage.getItem(KEY) || 'null');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toLocaleDateString('en-CA');
const monthOf = d => d.slice(0, 7);
const uid = () => crypto.randomUUID();
const money = c => 'CAD ' + (Math.abs(c) / 100).toLocaleString('en-CA', {minimumFractionDigits: 2, maximumFractionDigits: 2});

let mine = [];   // your entries (data/<you>.json)
let fund = [];   // shared home fund entries (data/shared.json)
let kind = 'expense';

// ---------- GitHub as the store: one private repo, plain JSON files ----------
const b64enc = s => { const b = new TextEncoder().encode(s); let t = ''; b.forEach(x => t += String.fromCharCode(x)); return btoa(t); };
const b64dec = s => { const t = atob(s.replace(/\n/g, '')); return new TextDecoder().decode(Uint8Array.from(t, c => c.charCodeAt(0))); };

async function gh(path, opt = {}) {
  const c = cfg();
  return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`, {
    ...opt,
    headers: {
      'Authorization': `Bearer ${c.token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    }
  });
}

async function readFile(name) {
  const r = await gh(`data/${name}.json`);
  if (r.status === 404) return { json: { version: 1, entries: [] }, sha: null };
  if (!r.ok) throw new Error(`GitHub returned ${r.status}`);
  const j = await r.json();
  return { json: JSON.parse(b64dec(j.content)), sha: j.sha };
}

async function writeFile(name, json, sha, message) {
  const body = { message, content: b64enc(JSON.stringify(json, null, 2) + '\n') };
  if (sha) body.sha = sha;
  const r = await gh(`data/${name}.json`, { method: 'PUT', body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) throw new Error('CONFLICT');
  if (!r.ok) throw new Error(`GitHub returned ${r.status}`);
}

// Read, change, write. If someone else saved in between, re-read and try once more.
async function mutate(name, change, message) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const { json, sha } = await readFile(name);
    const next = change(json);
    try { await writeFile(name, next, sha, message); return; }
    catch (e) { if (e.message !== 'CONFLICT' || attempt === 1) throw e; }
  }
}

async function refresh() {
  const c = cfg();
  const [a, b] = await Promise.all([readFile(c.me), readFile('shared')]);
  mine = a.json.entries;
  fund = b.json.entries;
  render();
}

// ---------- screens ----------
function go(name) {
  ['setup', 'home', 'activity', 'add'].forEach(s => $('#' + s).classList.toggle('hidden', s !== name));
  $('#tabs').classList.toggle('hidden', name === 'setup');
  document.querySelectorAll('nav [data-go]').forEach(b => {
    b.dataset.go === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
}

function entryRow(e, withDelete) {
  const sign = e.kind === 'income' ? '+' : e.kind === 'expense' ? '−' : '';
  const color = e.kind === 'income' ? 'var(--pos)' : 'var(--ink)';
  const title = esc(e.note || e.category || 'Entry');
  const sub = [e.category, e.date, e.fromHomeFund ? 'from home fund' : ''].filter(Boolean).map(esc).join(' · ');
  const del = withDelete ? `<button class="btn2" data-del="${e.id}" aria-label="Delete entry">Delete</button>` : '';
  return `<div class="row"><div style="min-width:0"><div style="font-weight:700">${title}</div><div class="muted">${sub}</div></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="num" style="color:${color};white-space:nowrap">${sign}${money(e.amount)}</span>${del}</div></div>`;
}

function render() {
  const c = cfg();
  const today = todayISO();
  $('#today').textContent = new Date().toLocaleDateString('en-CA', {weekday: 'long', day: 'numeric', month: 'long'});

  const m = monthOf(today);
  const spent = mine.filter(e => e.kind === 'expense' && monthOf(e.date) === m).reduce((s, e) => s + e.amount, 0);
  const budget = Math.round(c.budget * 100);
  $('#left').textContent = money(budget - spent);
  $('#left-sub').textContent = `${money(spent)} spent of ${money(budget)} this month`;

  const todays = mine.filter(e => e.date === today).sort((a, b) => b.createdAt - a.createdAt);
  const todayTotal = todays.filter(e => e.kind === 'expense').reduce((s, e) => s + e.amount, 0);
  $('#today-total').textContent = todayTotal ? `−${money(todayTotal)}` : '';
  $('#today-list').innerHTML = todays.length ? todays.map(e => entryRow(e, false)).join('') : '<div class="muted" style="padding:8px 0">Nothing yet today.</div>';

  const balance = fund.reduce((s, e) => s + (e.kind === 'in' ? e.amount : -e.amount), 0);
  $('#fund-balance').textContent = money(balance);
  const recent = fund.slice().sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
  $('#fund-list').innerHTML = recent.map(e => `<div class="row"><div><div style="font-weight:700">${esc(e.note)}</div><div class="muted">${esc(e.by)} · ${esc(e.date)}</div></div><span class="num">${e.kind === 'in' ? '+' : '−'}${money(e.amount)}</span></div>`).join('') || '<div class="muted">No home fund activity yet.</div>';

  const all = mine.slice().sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  $('#activity-list').innerHTML = all.length ? all.map(e => entryRow(e, true)).join('') : '<div class="muted">No entries yet.</div>';
}

// ---------- setup ----------
$('#s-save').onclick = async () => {
  const c = {
    me: $('#s-me').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, ''),
    owner: $('#s-owner').value.trim(),
    repo: $('#s-repo').value.trim(),
    token: $('#s-token').value.trim(),
    budget: parseFloat($('#s-budget').value.replace(',', '.'))
  };
  if (!c.me || !c.owner || !c.repo || !c.token || !(c.budget > 0)) {
    $('#s-msg').textContent = 'Fill in every field. Budget must be above zero.';
    return;
  }
  localStorage.setItem(KEY, JSON.stringify(c));
  $('#s-msg').textContent = 'Connecting…';
  try {
    await refresh();
    $('#s-msg').textContent = '';
    go('home');
  } catch (e) {
    localStorage.removeItem(KEY);
    $('#s-msg').textContent = `Could not connect: ${e.message}. Check the repo name and token.`;
  }
};
$('#gear').onclick = () => {
  const c = cfg() || {};
  $('#s-me').value = c.me || '';
  $('#s-owner').value = c.owner || 'Ramvilla1997';
  $('#s-repo').value = c.repo || '';
  $('#s-token').value = c.token || '';
  $('#s-budget').value = c.budget || 1850;
  go('setup');
};

// ---------- add ----------
document.querySelectorAll('#kinds [data-kind]').forEach(b => b.onclick = () => {
  kind = b.dataset.kind;
  document.querySelectorAll('#kinds [data-kind]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $('#cat-wrap').classList.toggle('hidden', kind !== 'expense');
});

$('#a-save').onclick = async () => {
  const c = cfg();
  const amount = Math.round(parseFloat($('#a-amt').value.replace(',', '.')) * 100);
  if (!(amount > 0)) { $('#a-msg').textContent = 'Enter an amount above zero.'; return; }
  const date = $('#a-date').value || todayISO();
  const note = $('#a-note').value.trim();
  const category = $('#a-cat').value;
  const fromFund = kind === 'expense' && $('#a-fund').checked;
  const id = uid(), createdAt = Date.now();
  const btn = $('#a-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  $('#a-msg').textContent = '';
  try {
    if (kind === 'fund') {
      await mutate('shared', j => ({ ...j, entries: [...j.entries, { id, date, kind: 'in', amount, note: note || 'Contribution', by: c.me, createdAt }] }),
        `fund in ${money(amount)} by ${c.me}`);
    } else {
      await mutate(c.me, j => ({ ...j, entries: [...j.entries, { id, date, kind, amount, category: kind === 'expense' ? category : 'Income', note, fromHomeFund: fromFund, createdAt }] }),
        `${kind} ${money(amount)} by ${c.me}`);
      if (fromFund) {
        await mutate('shared', j => ({ ...j, entries: [...j.entries, { id: uid(), ref: id, date, kind: 'out', amount, note: note || category, by: c.me, createdAt }] }),
          `fund out ${money(amount)} by ${c.me}`);
      }
    }
    $('#a-amt').value = ''; $('#a-note').value = ''; $('#a-fund').checked = false;
    await refresh();
    go('home');
  } catch (e) {
    $('#a-msg').textContent = `Not saved: ${e.message}. Check your connection and try again.`;
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
};

// ---------- activity: delete your own entries ----------
$('#activity-list').onclick = async e => {
  const id = e.target.closest('[data-del]')?.dataset.del;
  if (!id || !confirm('Delete this entry?')) return;
  const c = cfg();
  const entry = mine.find(x => x.id === id);
  try {
    await mutate(c.me, j => ({ ...j, entries: j.entries.filter(x => x.id !== id) }), `delete entry ${id} by ${c.me}`);
    if (entry && entry.fromHomeFund) {
      await mutate('shared', j => ({ ...j, entries: j.entries.filter(x => x.ref !== id) }), `remove fund entry for ${id}`);
    }
    await refresh();
  } catch (err) {
    alert(`Not deleted: ${err.message}`);
  }
};

// ---------- navigation ----------
document.querySelectorAll('nav [data-go]').forEach(b => b.onclick = () => {
  if (b.dataset.go === 'add') {
    $('#a-date').value = todayISO();
    $('#a-msg').textContent = '';
  }
  go(b.dataset.go);
});

// ---------- boot ----------
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  $('#a-date').value = todayISO();
  if (!cfg()) { go('setup'); return; }
  go('home');
  try { await refresh(); }
  catch (e) {
    $('#left-sub').textContent = `Could not reach GitHub (${e.message}). Open Settings to check.`;
  }
})();
</script>
</body>
</html>
