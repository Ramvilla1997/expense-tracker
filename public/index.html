<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="description" content="Tally — shared expenses, simply counted.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<title>Tally</title>
</head>
<body>
<div id="offline" class="banner" role="status" hidden style="position:sticky;top:0;z-index:30;border-radius:0;justify-content:center">You’re offline. Changes will sync when you’re back online.</div>
<main id="app" aria-live="polite"></main>
<nav id="tabs" aria-label="Main" hidden></nav>
<div id="backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">Tally needs JavaScript turned on.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
